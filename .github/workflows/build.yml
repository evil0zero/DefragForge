name: Build and test source
on:
  push:
  pull_request:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build Win32/x64 solution (no binary release)
        run: msbuild DefragForge.sln /m /p:Configuration=Release /p:Platform=x64 /p:DefragTarget=0x0A00 /p:DefragToolset=v143
      - name: Run planning tests
        shell: cmd
        run: out\x64\Release\PlannerTests.exe
